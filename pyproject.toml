[project]
name = "aster-quant"
version = "0.1.0"
description = "ASTER 量化执行层（Python）"
requires-python = ">=3.12"
dependencies = [
    "akshare==1.18.97",
    "autogluon>=1.6.3",
    "cvxpy>=1.9.3",
    "matplotlib>=3.11.2",
    "polars>=1.0",
    "pyarrow>=24.0.0",
    "torch>=2.10",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# 默认跳过真实训练；单独跑：uv run pytest -m slow
addopts = '-m "not slow"'
markers = [
    "slow: 触发真实 AutoGluon 训练，默认跳过",
]
