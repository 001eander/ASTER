[project]
name = "aster-quant"
version = "0.1.0"
description = "ASTER 量化执行层（Python）"
requires-python = ">=3.12"
dependencies = [
    "akshare==1.18.97",
    "polars>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
