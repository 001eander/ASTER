<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" width="720" height="500" role="img">
  <title>Agent 因子挖掘闭环</title>
  <desc>课题下达后，每一轮并行提出 3 条灵感，在断网沙盒里评分，结果写入 trace；通过门控的因子进入因子库，未过线的灵感回到下一轮。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#7a5bb5"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="720" height="500" fill="#fcfaf5"/>

  <!-- 第一行：课题 → 灵感 -->
  <rect x="45" y="40" width="270" height="90" rx="2" fill="#f6f3ec" stroke="#d6cebe"/>
  <text x="61" y="70" font-family="Cascadia Mono, Consolas, monospace" font-size="16" letter-spacing="2" fill="#7a5bb5">01</text>
  <text x="180" y="98" text-anchor="middle" font-family="Songti SC, STSong, SimSun, Georgia, serif" font-size="32" fill="#191512">课题</text>
  <text x="180" y="120" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#4d463d">方向 · 预算 · 验收</text>

  <rect x="385" y="40" width="270" height="90" rx="2" fill="#f6f3ec" stroke="#d6cebe"/>
  <text x="401" y="70" font-family="Cascadia Mono, Consolas, monospace" font-size="16" letter-spacing="2" fill="#7a5bb5">02</text>
  <text x="520" y="98" text-anchor="middle" font-family="Songti SC, STSong, SimSun, Georgia, serif" font-size="32" fill="#191512">灵感</text>
  <text x="520" y="120" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#4d463d">每轮 3 条</text>

  <!-- 第二行：沙盒评分 → trace -->
  <rect x="385" y="205" width="270" height="90" rx="2" fill="#f6f3ec" stroke="#d6cebe"/>
  <text x="401" y="235" font-family="Cascadia Mono, Consolas, monospace" font-size="16" letter-spacing="2" fill="#7a5bb5">03</text>
  <text x="520" y="263" text-anchor="middle" font-family="Songti SC, STSong, SimSun, Georgia, serif" font-size="32" fill="#191512">沙盒评分</text>
  <text x="520" y="285" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#4d463d">断网 · score.json</text>

  <rect x="45" y="205" width="270" height="90" rx="2" fill="#f6f3ec" stroke="#d6cebe"/>
  <text x="61" y="235" font-family="Cascadia Mono, Consolas, monospace" font-size="16" letter-spacing="2" fill="#7a5bb5">04</text>
  <text x="180" y="263" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" font-size="32" fill="#191512">trace</text>
  <text x="180" y="285" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#4d463d">逐轮记录</text>

  <!-- 第三行：门控 → 因子库 -->
  <rect x="45" y="370" width="270" height="90" rx="2" fill="#f6f3ec" stroke="#d6cebe"/>
  <text x="61" y="400" font-family="Cascadia Mono, Consolas, monospace" font-size="16" letter-spacing="2" fill="#7a5bb5">05</text>
  <text x="180" y="428" text-anchor="middle" font-family="Songti SC, STSong, SimSun, Georgia, serif" font-size="32" fill="#191512">门控</text>
  <text x="180" y="450" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#4d463d">过线才入库</text>

  <rect x="385" y="370" width="270" height="90" rx="2" fill="#f6f3ec" stroke="#d6cebe"/>
  <text x="401" y="400" font-family="Cascadia Mono, Consolas, monospace" font-size="16" letter-spacing="2" fill="#7a5bb5">06</text>
  <text x="520" y="428" text-anchor="middle" font-family="Songti SC, STSong, SimSun, Georgia, serif" font-size="32" fill="#191512">因子库</text>
  <text x="520" y="450" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#4d463d">唯一接口</text>

  <!-- 前进箭头 -->
  <g stroke="#7a5bb5" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M315 85 H377"/>
    <path d="M520 130 V197"/>
    <path d="M385 250 H323"/>
    <path d="M180 295 V362"/>
    <path d="M315 415 H377"/>
  </g>

  <!-- 闭环：入库的空隙回到下一轮 -->
  <path d="M655 415 H690 V85 H663" fill="none" stroke="#7a5bb5" stroke-width="1.2" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
  <text x="680" y="180" text-anchor="end" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#4d463d">下一轮</text>
</svg>
